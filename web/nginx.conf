# Network decision: the front NEVER crosses origin (see docs/04-CONTRATO-API.md).
# The backend's CORS_ORIGINS only allows :5173 (dev), so in delivery this
# server must be the single origin the browser talks to: it serves the built
# SPA AND reverse-proxies /api and /uploads to the api container. The React
# app only ever calls relative paths ("/api/...", "/uploads/...").

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers for every response served here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Nginx's default client_max_body_size is 1 MB, below the API's
    # MAX_UPLOAD_SIZE (2 MB). Without raising it, a 1.5 MB product image
    # would be rejected here with an HTML 413 that the SPA cannot parse,
    # instead of reaching the API's JSON 413 (PayloadTooLargeError).
    # Kept above MAX_UPLOAD_SIZE on purpose so the API is always the one
    # that enforces the limit and formats the error.
    client_max_body_size 5m;

    location /api {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Fail fast when the api container is down so the SPA can show an
        # error instead of a spinner for the default 60 s connect timeout.
        proxy_connect_timeout 5s;
    }

    location /uploads {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    # Vite emits content-hashed filenames under /assets, so they can be
    # cached forever; a new build produces new names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # React Router client-side routing: any path that isn't a real static
    # file falls back to index.html so deep links (e.g. /products) work.
    # index.html itself must never be cached, otherwise a browser could keep
    # pointing at asset hashes that no longer exist after a redeploy.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
